name: Bug report
description: Report reproducible MATARI behavior without including private Codex data.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not attach Codex session JSONL, prompts, responses,
        tool payloads, credentials, account/session identifiers, usernames, or absolute local paths.
        Security vulnerabilities belong in a private security advisory.

  - type: input
    id: version
    attributes:
      label: MATARI version or commit
      placeholder: "0.1.0 or baaeb83"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS and Mac
      placeholder: "macOS 15.6, Apple silicon"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Codex source
      options:
        - Codex Desktop
        - Codex CLI
        - Both Desktop and CLI
        - Custom CODEX_HOME
        - Unknown or not source-specific
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Menu bar label
        - Quota buckets and reset time
        - Local token totals
        - Approximate tokens per 1%
        - File scanning or automatic updates
        - Settings or login item
        - Build or installation
        - Accessibility or appearance
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or fully sanitized examples only.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional sanitized context
      description: Attach screenshots only after removing local paths, identifiers, and private content.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include session JSONL, prompts, responses, tool payloads, credentials, identifiers, or private paths.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
